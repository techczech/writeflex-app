<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Packing list</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 18px 16px; font: 14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #2b2a27; background: #faf8f3; }
  h1 { margin: 0 0 8px; font-size: 15px; font-weight: 650; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; }
  li label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  input[type=checkbox] { accent-color: #b5532f; width: 15px; height: 15px; }
  li.done span { color: #8a867a; text-decoration: line-through; }
  .foot { margin-top: 10px; display: flex; align-items: center; gap: 12px; }
  .count { font-weight: 650; font-variant-numeric: tabular-nums; color: #b5532f; }
  .track { flex: 1; height: 8px; border-radius: 4px; background: #e7e2d6; overflow: hidden; }
  .bar { height: 100%; width: 0; background: #b5532f; transition: width .12s ease-out; }
  button { font: inherit; font-size: 12.5px; padding: 3px 10px; border: 1px solid #cfc8b8; border-radius: 6px; background: #fff; color: #2b2a27; cursor: pointer; }
  button:hover { background: #f1ede2; }
  .note { margin-top: 8px; font-size: 12.5px; color: #6b685e; }
</style>
</head>
<body>
<h1>Packed for the long way?</h1>
<ul id="items"></ul>
<div class="foot"><span class="count" id="count"></span><div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div><button type="button" id="reset">Unpack</button></div>
<div class="note">This page runs on its own: it reads nothing and sends nothing, and it forgets your ticks when the file is closed.</div>
<script>
(function () {
  var things = ['Flask of tea', 'Waterproof', 'Map, folded to the right square', 'Sandwiches', 'Walking boots', 'Notebook and pencil'];
  var list = document.getElementById('items');
  var boxes = [];
  things.forEach(function (name, index) {
    var li = document.createElement('li');
    var label = document.createElement('label');
    var box = document.createElement('input');
    box.type = 'checkbox';
    box.id = 'item' + index;
    var text = document.createElement('span');
    text.textContent = name;
    label.appendChild(box);
    label.appendChild(text);
    li.appendChild(label);
    list.appendChild(li);
    box.addEventListener('change', update);
    boxes.push(box);
  });
  function update() {
    var ticked = 0;
    boxes.forEach(function (box) {
      if (box.checked) ticked += 1;
      box.parentNode.parentNode.className = box.checked ? 'done' : '';
    });
    document.getElementById('count').textContent = ticked + ' of ' + boxes.length + (ticked === boxes.length ? ' · ready' : '');
    document.getElementById('bar').style.width = (100 * ticked / boxes.length) + '%';
  }
  document.getElementById('reset').addEventListener('click', function () {
    boxes.forEach(function (box) { box.checked = false; });
    update();
  });
  update();
})();
</script>
</body>
</html>
