[extend]
useDefault = true

# The snapshot gate verifies every path and digest before scanning.
# Anchors deliberately exclude only the manifest at the snapshot root.
[[allowlists]]
description = "Structurally verified root snapshot hash manifest"
paths = ['''^public-snapshot-receipt\.json$''']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Zotero key alphabet constant"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)packages/readflex/zotero-bridge/src/annotation-write\.ts$''']
regexes = ['''^23456789ABCDEFGHIJKLMNPQRSTUVWXYZ$''']
[[rules.allowlists]]
description = "Zotero key alphabet in upstream reader bundle"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)packages/readflex/reader-embed/vendor/reader/reader\.js$''']
regexes = ['''^23456789ABCDEFGHIJKLMNPQRSTUVWXYZ$''']
[[rules.allowlists]]
description = "Citation key fixture"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)tests/main/reading-room-shelf\.test\.ts$''']
regexes = ['''^Lakoff1987Women$''']
[[rules.allowlists]]
description = "Czech chapter file-name fixtures (kapitola contains 'api')"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)tests/main/folio(-chapter-order)?\.test\.ts$''']
regexes = ['''^[Kk]apitola[-_]-?[0-9]+(-[a-z])?\.md$''']
