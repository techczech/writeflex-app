<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<style>{{styles}}</style>
</head>
<body class="wf-design-{{design}}">{{front-page}}
<div class="shell">
<aside class="sidebar" aria-label="Document contents">
<h2 class="sidebar-title">{{sidebar-title}}</h2>
<details class="toc-disclosure" open>
<summary class="toc-label">Contents</summary>
<nav id="toc">
{{sidebar}}
</nav>
</details>
</aside>
<main class="main">
{{document-header}}
<article class="content">
{{body}}
</article>
</main>
</div>{{reader-notes}}
<script>
(() => {
  const contents = document.querySelector('.toc-disclosure');
  if (!contents) return;
  const mobile = window.matchMedia('(max-width: 900px)');
  const syncContents = () => { contents.open = !mobile.matches; };
  syncContents();
  mobile.addEventListener('change', syncContents);
  contents.addEventListener('click', (event) => {
    if (mobile.matches && event.target.closest('a[href]')) contents.open = false;
  });
  contents.addEventListener('keydown', (event) => {
    if (mobile.matches && event.key === 'Escape' && contents.open) {
      contents.open = false;
      contents.querySelector('summary').focus();
    }
  });
})();
</script>
</body>
</html>
