<div class="reader-badge-region" data-writeflex-reader-badge>
  <div class="reader-badge-explainer" id="wf-reader-badge-explainer" role="tooltip" hidden>
    <p class="reader-badge-intro">{{intro}}</p>
{{explainer}}
  </div>
  <span class="reader-badge" id="wf-reader-badge" tabindex="0" role="note" aria-describedby="wf-reader-badge-explainer">
    <span class="reader-badge-mark" aria-hidden="true">i</span>
    <span class="reader-badge-text">{{badge-label}}</span>
  </span>
</div>
<div class="reader-return-region" data-writeflex-reader-return>
  <button class="reader-return" id="wf-reader-return" type="button">{{return-label}}</button>
</div>
<script data-writeflex-reader-badge-runtime>
{{runtime}}
</script>
