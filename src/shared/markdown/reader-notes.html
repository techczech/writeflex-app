<div class="reader-selection-prompt" id="wf-reader-selection-prompt" hidden>
  <button type="button">Add comment</button>
</div>
<aside class="notes-drawer" id="wf-reader-notes-drawer" data-writeflex-reader-drawer aria-label="Reader comments" aria-hidden="true">
  <div class="drawer-head">
    <h2>Reader comments</h2>
    <button class="drawer-close" id="wf-reader-notes-close" type="button" aria-label="Close comments">×</button>
  </div>
  <p class="reader-storage-note">Comments stay in this browser until you save them.</p>
  <div id="wf-reader-notes-list"></div>
  <p class="reader-empty-note" id="wf-reader-notes-empty">Highlight text in the document to add a comment.</p>
  <div class="reader-export-actions">
    <button type="button" id="wf-reader-notes-markdown">Save comments as Markdown</button>
  </div>
</aside>
<script data-writeflex-reader-notes-runtime>
{{runtime}}
</script>
