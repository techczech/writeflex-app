<aside class="edits-drawer" id="wf-reader-edits-drawer" data-writeflex-reader-drawer aria-label="Reader edits" aria-hidden="true">
  <div class="drawer-head">
    <h2>Reader edits</h2>
    <button class="drawer-close" id="wf-reader-edits-close" type="button" aria-label="Close edits">×</button>
  </div>
  <p class="reader-storage-note">Any passage can be rewritten directly. The original wording stays packaged for comparison.</p>
  <div id="wf-reader-edits-list"></div>
  <p class="reader-empty-note" id="wf-reader-edits-empty">No passages have changed yet.</p>
</aside>
<script data-writeflex-reader-edits-runtime>
{{runtime}}
</script>
