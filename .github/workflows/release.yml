name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Check version tag
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: matrix.platform == 'win'
        with:
          toolchain: 1.90.0
          targets: x86_64-pc-windows-msvc
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Signed and notarised Mac dmg and zip
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          bunx electron-builder --mac --publish never
          app=release/mac-arm64/WriteFlex.app
          codesign --verify --deep --strict "$app"
          details=$(codesign -dvvv "$app" 2>&1)
          printf '%s\n' "$details" | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          printf '%s\n' "$details" | grep -E 'flags=.*\(runtime\)'
          printf '%s\n' "$details" | grep 'Authority=Developer ID Application:'
          validate_app() {
            codesign --verify --deep --strict "$1"
            details=$(codesign -dvvv "$1" 2>&1)
            printf '%s\n' "$details" | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            printf '%s\n' "$details" | grep -E 'flags=.*\(runtime\)'
            printf '%s\n' "$details" | grep 'Authority=Developer ID Application:'
            xcrun stapler validate "$1"
            spctl -a -vv -t exec "$1"
          }
          validate_app "$app"
          mount=$(mktemp -d)
          extracted=$(mktemp -d)
          mounted=false
          cleanup() {
            if [ "$mounted" = true ]; then hdiutil detach "$mount"; fi
            rm -rf "$mount" "$extracted"
          }
          trap cleanup EXIT
          for dmg in release/*.dmg; do
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
            mounted=true
            validate_app "$mount/WriteFlex.app"
            hdiutil detach "$mount"
            mounted=false
          done
          for zip in release/*.zip; do
            ditto -x -k "$zip" "$extracted"
            validate_app "$extracted/WriteFlex.app"
            rm -rf "$extracted/WriteFlex.app"
          done
        env:
          CSC_LINK: ${{ secrets.APPLE_DEVID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Unsigned Windows installer
        if: matrix.platform == 'win'
        run: bunx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
  draft:
    permissions:
      contents: write
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true
      - name: Create draft and attach installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release-state.json 2> release-error.txt; then
            node -e 'if (!require("./release-state.json").isDraft) throw new Error("Refusing to modify a published release")'
            node -e 'for (const asset of require("./release-state.json").assets) console.log(asset.name)' > stale-assets.txt
            while IFS= read -r asset; do
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < stale-assets.txt
          else
            # Only the CLI's explicit missing-release result permits creation.
            if ! grep -Fxq 'release not found' release-error.txt; then
              cat release-error.txt >&2
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "WriteFlex $GITHUB_REF_NAME" --notes 'macOS Apple Silicon and Windows x64 installers.'
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" installers/*
