name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package-mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Verify bootstrap checkout pin
        shell: bash
        env:
          CHECKOUT_SHA: '11d5960a326750d5838078e36cf38b85af677262'
          CHECKOUT_REF: 'refs/tags/v4.4.0'
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/actions/checkout.git "$CHECKOUT_REF" "$CHECKOUT_REF^{}" | awk -v ref="$CHECKOUT_REF" '$2 == ref {sha=$1} $2 == ref "^{}" {peeled=$1} END {print peeled ? peeled : sha}')"
          test "$actual" = "$CHECKOUT_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Validate all remaining pins before any setup/build action.
      - run: node scripts/check-action-pins.mjs
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Check version tag
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Signed and notarised Mac dmg and zip
        shell: bash
        run: |
          set -euo pipefail
          bunx electron-builder --mac --publish never
          # The Zotero plugin the build made rides with the installers: its update feed
          # (zotero-plugin/updates.json) links to it on the latest release.
          cp zotero-plugin/dist/writeflex-zotero-*.xpi release/
          app=release/mac-arm64/WriteFlex.app
          codesign --verify --deep --strict "$app"
          details=$(codesign -dvvv "$app" 2>&1)
          printf '%s\n' "$details" | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          printf '%s\n' "$details" | grep -E 'flags=.*\(runtime\)'
          printf '%s\n' "$details" | grep 'Authority=Developer ID Application:'
          validate_app() {
            codesign --verify --deep --strict "$1"
            details=$(codesign -dvvv "$1" 2>&1)
            printf '%s\n' "$details" | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            printf '%s\n' "$details" | grep -E 'flags=.*\(runtime\)'
            printf '%s\n' "$details" | grep 'Authority=Developer ID Application:'
            xcrun stapler validate "$1"
            spctl -a -vv -t exec "$1"
          }
          validate_app "$app"
          mount=$(mktemp -d)
          extracted=$(mktemp -d)
          mounted=false
          cleanup() {
            if [ "$mounted" = true ]; then hdiutil detach "$mount"; fi
            rm -rf "$mount" "$extracted"
          }
          trap cleanup EXIT
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          [ -n "${dmgs[*]:-}" ] && [ -n "${zips[*]:-}" ] || { echo "Missing Mac installers" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
            mounted=true
            validate_app "$mount/WriteFlex.app"
            hdiutil detach "$mount"
            mounted=false
          done
          for zip in "${zips[@]}"; do
            ditto -x -k "$zip" "$extracted"
            validate_app "$extracted/WriteFlex.app"
            rm -rf "$extracted/WriteFlex.app"
          done
        env:
          CSC_LINK: ${{ secrets.APPLE_DEVID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.xpi
          if-no-files-found: error
  package-win:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Verify bootstrap checkout pin
        shell: bash
        env:
          CHECKOUT_SHA: '11d5960a326750d5838078e36cf38b85af677262'
          CHECKOUT_REF: 'refs/tags/v4.4.0'
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/actions/checkout.git "$CHECKOUT_REF" "$CHECKOUT_REF^{}" | awk -v ref="$CHECKOUT_REF" '$2 == ref {sha=$1} $2 == ref "^{}" {peeled=$1} END {print peeled ? peeled : sha}')"
          test "$actual" = "$CHECKOUT_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Validate all remaining pins before any setup/build action.
      - run: node scripts/check-action-pins.mjs
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Check version tag
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # refs/heads/stable
        with:
          toolchain: 1.90.0
          targets: x86_64-pc-windows-msvc
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Unsigned Windows installer
        run: bunx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-win
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
  draft:
    permissions:
      contents: write
    needs: [package-mac, package-win]
    if: ${{ !cancelled() && needs.package-mac.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify bootstrap checkout pin
        shell: bash
        env:
          CHECKOUT_SHA: '11d5960a326750d5838078e36cf38b85af677262'
          CHECKOUT_REF: 'refs/tags/v4.4.0'
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/actions/checkout.git "$CHECKOUT_REF" "$CHECKOUT_REF^{}" | awk -v ref="$CHECKOUT_REF" '$2 == ref {sha=$1} $2 == ref "^{}" {peeled=$1} END {print peeled ? peeled : sha}')"
          test "$actual" = "$CHECKOUT_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node scripts/check-action-pins.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true
      - name: Create draft and attach installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(installers/*.dmg)
          zips=(installers/*.zip)
          win=(installers/*.exe)
          xpis=(installers/*.xpi)
          assets=(installers/*.dmg installers/*.zip installers/*.exe installers/*.xpi)
          [ -n "${dmgs[*]:-}" ] && [ -n "${zips[*]:-}" ] || { echo "Missing Mac installers" >&2; exit 1; }
          printf '%s\n' 'Attached: macOS Apple Silicon.' > release-notes.txt
          if [ -n "${win[*]:-}" ]; then
            printf '%s\n' 'Attached: Windows x64.' >> release-notes.txt
          else
            printf '%s\n' 'Windows x64 is not attached; its packaging job did not supply an installer.' >> release-notes.txt
          fi
          if [ -n "${xpis[*]:-}" ]; then
            printf '%s\n' 'Attached: WriteFlex for Zotero (install in Zotero from Tools > Plugins).' >> release-notes.txt
          fi
          # GitHub has no conditional draft-only mutation API. Recheck before
          # every mutation to minimise the remaining check-to-request race.
          require_draft() {
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state-check.json
            node -e 'if (require("./release-state-check.json").isDraft !== true) throw new Error("Refusing to modify a published release")'
          }
          existing=false
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release-state.json 2> release-error.txt; then
            node -e 'if (require("./release-state.json").isDraft !== true) throw new Error("Refusing to modify a published release")'
            existing=true
            node -e 'for (const asset of require("./release-state.json").assets) console.log(asset.name)' > stale-assets.txt
            while IFS= read -r asset; do
              require_draft
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < stale-assets.txt
          else
            # Only the CLI's explicit missing-release result permits creation.
            if ! grep -Fxq 'release not found' release-error.txt; then
              cat release-error.txt >&2
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "WriteFlex $GITHUB_REF_NAME" --notes-file release-notes.txt
          fi
          if [ "$existing" = true ]; then
            require_draft
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.txt
          fi
          require_draft
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
