name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scout-diagnostic:
        description: 'Diagnostic run: observe the synthetic scout subprocess in unit tests (prints bounded events to the job log; not an acceptance run)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Verify bootstrap checkout pin
        shell: bash
        env:
          CHECKOUT_SHA: '11d5960a326750d5838078e36cf38b85af677262'
          CHECKOUT_REF: 'refs/tags/v4.4.0'
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/actions/checkout.git "$CHECKOUT_REF" "$CHECKOUT_REF^{}" | awk -v ref="$CHECKOUT_REF" '$2 == ref {sha=$1} $2 == ref "^{}" {peeled=$1} END {print peeled ? peeled : sha}')"
          test "$actual" = "$CHECKOUT_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Validate all remaining pins before any setup/build action.
      - run: node scripts/check-action-pins.mjs
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - run: bun install --frozen-lockfile
      - run: node node_modules/playwright/cli.js install chromium-headless-shell
      - run: bun run typecheck
      - name: Unit tests
        if: ${{ inputs.scout-diagnostic != true }}
        run: bun test
      - name: Unit tests with synthetic scout observation (diagnostic, not acceptance)
        if: ${{ inputs.scout-diagnostic == true }}
        run: bun test --preload ./tests/helpers/observe-synthetic-scout.cjs
      - run: bun run build
